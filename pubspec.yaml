name: vajrafit
description: VajraFit Pro - All-in-One Fitness, Gym, Run & Defence Training App
publish_to: 'none'
version: 2.1.0+3

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.3
  geolocator: ^12.0.0
  sensors_plus: ^5.0.1
  flutter_tts: ^4.0.2
  share_plus: ^9.0.0
  path_provider: ^2.1.3
  camera: ^0.11.0+2
  google_mlkit_pose_detection: ^0.12.0
  permission_handler: ^11.3.1
  supabase_flutter: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
